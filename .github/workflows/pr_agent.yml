name: PR-Agent (cross-family review, reusable)

# Reusable org-wide AI code review. Callers pass their PR events in; this workflow runs a model
# from a DIFFERENT lab than the PR author (Claude), so it is a genuine independent check.
#
# One source of truth for every ryaniosys/*-agent repo. A caller repo only supplies a ~10-line
# `.github/workflows/pr_agent.yml` that forwards its pull_request / issue_comment events here.
#
# Config that must be uniform (model, gateway, which tools run) lives in this file as env, which
# overrides any repo .pr_agent.toml. The REVIEW RUBRIC lives in ryaniosys/pr-agent-settings/
# .pr_agent.toml (org-global, applied with lower precedence), so a repo can override it by
# committing its own .pr_agent.toml. The litellm virtual key is fetched at runtime from the
# self-hosted Infisical via OIDC, so no long-lived secret lives in any repo.

on:
  workflow_call: {}

jobs:
  pr_agent:
    # Gated on the org (or repo-override) variable PR_AGENT_ENABLED so onboarding a repo does not
    # spam failing runs before provisioning lands. Second clause keeps comment-triggered runs
    # (/review, /improve) to PRs only. vars here resolves to org + caller-repo variables.
    if: >-
      ${{ vars.PR_AGENT_ENABLED == 'true' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) }}
    # Pinned rather than ubuntu-latest: this job installs a kernel WireGuard client, and a
    # silent image bump is a change nobody reviewed. Not ubuntu-slim: that runner is a
    # container without /dev/net/tun or Docker, and this job needs both.
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch litellm key from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          # All three are non-secret and inherited from org Actions Variables, so no repo needs
          # to set them. The OIDC identity is bound to repo:ryaniosys/*, so it works org-wide.
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /                  # project root of the pr-agent project; holds LITELLM_KEY
          export-type: env                # and NETBIRD_CI_SETUP_KEY, exported into the job env

      # litellm.iosys.ch resolves and answers only inside the NetBird overlay. The runner joins
      # as an ephemeral peer in the `ci` group (iosys-netbird, policy 15: 443 on the LiteLLM VM)
      # and drops out on its own once the VM is gone. The key comes from Infisical above,
      # so no NetBird secret lives in GitHub.
      - name: Join the NetBird overlay
        env:
          NETBIRD_VERSION: "0.78.1"
          NETBIRD_DEB_SHA256: "c461cfa27426e346c2479ec6dc83803a812dfcec135eb0f67a4dce0da75ad5db"
          LITELLM_API_BASE: ${{ vars.LITELLM_API_BASE }}
        run: |
          set -euo pipefail
          : "${NETBIRD_CI_SETUP_KEY:?NETBIRD_CI_SETUP_KEY missing from Infisical (pr-agent project, prod, /)}"
          : "${LITELLM_API_BASE:?org variable LITELLM_API_BASE is not set}"
          deb="netbird_${NETBIRD_VERSION}_linux_amd64.deb"
          curl -fsSL -o "/tmp/$deb" \
            "https://github.com/netbirdio/netbird/releases/download/v${NETBIRD_VERSION}/$deb"
          echo "${NETBIRD_DEB_SHA256}  /tmp/$deb" | sha256sum -c -
          # The .deb's postinst installs and starts the daemon itself.
          sudo apt-get install -y -qq "/tmp/$deb" >/dev/null
          # Key via NB_SETUP_KEY rather than --setup-key, so it stays out of the process list.
          # `up` blocks until management and signal are connected, not until peers and DNS are.
          sudo NB_SETUP_KEY="$NETBIRD_CI_SETUP_KEY" \
            netbird up --hostname "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # The peer tunnel and the overlay DNS entries come up after `up` returns.
          health="${LITELLM_API_BASE%/}"; health="${health%/v1}/health/liveliness"
          for _ in $(seq 1 45); do
            if curl -fsS --max-time 5 -o /dev/null "$health"; then
              echo "LiteLLM reachable over NetBird"; exit 0
            fi
            sleep 2
          done
          echo "::error::LiteLLM not reachable over NetBird after 90s ($health)"
          sudo netbird status -d || true
          exit 1

      # Run the Action's image directly instead of `uses: the-pr-agent/pr-agent`: a Docker
      # container action gets the job's bridge network, whose DNS bypasses systemd-resolved and
      # with it NetBird's overlay zone, so litellm.iosys.ch would stay NXDOMAIN inside it. With
      # --network host the container uses the runner's resolver and routes, NetBird included.
      # Same release as the Action this replaces (the-pr-agent/pr-agent@v0.41.1). Its Dockerfile
      # pulls the mutable `github_action` tag, which by now is a newer release; this pins the
      # versioned tag by digest instead, so an upgrade is a reviewed change here.
      - name: Run PR-Agent
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -e GITHUB_EVENT_NAME -e GITHUB_EVENT_PATH -e GITHUB_OUTPUT -e GITHUB_STEP_SUMMARY \
            -e GITHUB_REPOSITORY -e GITHUB_API_URL -e GITHUB_SERVER_URL -e GITHUB_SHA -e GITHUB_REF \
            -e GITHUB_ACTIONS -e GITHUB_TOKEN \
            -e CONFIG.MODEL -e CONFIG.FALLBACK_MODELS -e CONFIG.CUSTOM_MODEL_MAX_TOKENS \
            -e OPENAI.API_BASE -e OPENAI.KEY -e LITELLM.DROP_PARAMS -e LITELLM.EXTRA_HEADERS \
            -e GITHUB_ACTION_CONFIG.AUTO_DESCRIBE -e GITHUB_ACTION_CONFIG.AUTO_REVIEW \
            -e GITHUB_ACTION_CONFIG.AUTO_IMPROVE -e GITHUB_ACTION_CONFIG.PR_ACTIONS \
            pragent/pr-agent:0.41.1-github_action@sha256:ec267eb168375c150d75efc024e2b10e0e2768ad0c000f15fd2378fe63abfe98
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model + gateway config live here (not only in .pr_agent.toml) because the Action reads
          # the toml from the DEFAULT branch, so a pre-merge PR would otherwise run with defaults.
          # Env wins over both the org-global and the repo-local toml, keeping the model uniform.
          CONFIG.MODEL: "openai/openrouter/openai/gpt-5.6-luna-pro"
          CONFIG.FALLBACK_MODELS: '["openai/openrouter/openai/gpt-5.6-terra"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "1000000"
          OPENAI.API_BASE: "${{ vars.LITELLM_API_BASE }}"
          # These OpenRouter reasoning models reject some params PR-Agent sends (temperature etc.),
          # which raised UnsupportedParamsError on EVERY primary call and silently fell back to the
          # expensive gemini-3.1-pro-preview (100 fallback calls = USD 10+ before this was caught).
          # drop_params tells litellm to strip the unsupported param instead of erroring, so the
          # cheap primary actually serves the review. Fallback is now a cheap same-family model too.
          LITELLM.DROP_PARAMS: "true"
          # Which tools run, and on which PR events (incl. synchronize, so pushes re-review).
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened","reopened","ready_for_review","synchronize"]'
          # Authenticate to the litellm gateway. It runs forward_client_headers_to_llm_api, which
          # forwards Authorization UPSTREAM, so the established iosys pattern is x-litellm-api-key.
          # We send both: OPENAI.KEY satisfies the client's api_key requirement, the header carries
          # the gateway-side auth.
          OPENAI.KEY: ${{ env.LITELLM_KEY }}
          LITELLM.EXTRA_HEADERS: '{"x-litellm-api-key": "${{ env.LITELLM_KEY }}"}'
